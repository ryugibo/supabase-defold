[supabase]
group = Runtime
title = Supabase
help = Supabase client settings. supabase.new() reads them for any option it is not given.

url.type = string
url.label = Project URL
url.help = https://<project-ref>.supabase.co

anon_key.type = string
anon_key.label = Publishable Key
anon_key.help = Publishable (anon) key. Never use the secret / service_role key in a game build.

schema.type = string
schema.help = Default PostgREST schema. Other schemas must be listed in the Data API's Exposed schemas.
schema.default = public

persist_session.type = bool
persist_session.help = Save the session with sys.save and restore it in auth:initialize()
persist_session.default = 0

auto_refresh_token.type = bool
auto_refresh_token.help = Refresh an expiring session before requests
auto_refresh_token.default = 1

flow_type.type = string
flow_type.options = implicit:Implicit,pkce:PKCE
flow_type.help = Auth flow for OAuth, magic links, SSO and password recovery
flow_type.default = implicit

timeout.type = integer
timeout.help = HTTP timeout in seconds
timeout.minimum = 1
timeout.default = 15
